apiVersion: v1
kind: Service
metadata:
  name: autoscale-demo
  labels:
    app: autoscale-demo
spec:
  selector:
    app: autoscale-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: autoscale-demo
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: autoscale-demo
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s